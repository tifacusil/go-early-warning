name: ci

# Continuous Integration: verifica cada cambio (PR y push a main) sin publicar
# artefactos. Concepto CI = integrar y validar temprano: lint, build, tests,
# contratos y que la imagen construya.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Cancela runs viejos del mismo branch/PR cuando llega un push nuevo.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Calidad estática: formato, vet, linters ──────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: gofmt (sin diffs)
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "Archivos sin formatear:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  # ── Build + tests con cobertura ──────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: build
        run: go build ./...

      - name: test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # ── Contratos: examples válidos y stubs gRPC al día ──────────────────────
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: contract-validate (JSON Schema)
        run: go run ./tools/contract-validate

      - name: buf setup
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: lint .proto
        run: cd contracts/proto && buf lint

      - name: stubs gRPC al día (buf generate sin diffs)
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          cd contracts/proto && buf generate
          cd "$GITHUB_WORKSPACE"
          if ! git diff --exit-code -- internal/earlywarning/grpc; then
            echo "Stubs gRPC desactualizados: corre 'make proto' y commitea."; exit 1
          fi

  # ── Validar que la imagen construye (sin publicar) ───────────────────────
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: early-warning:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
