name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Calidad estática: formato, vet, linters ──────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt (sin diffs)
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "Archivos sin formatear:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  # ── Build + tests con cobertura ──────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: go build ./...

      - name: test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # ── Contratos: examples válidos y stubs gRPC al día ──────────────────────
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: contract-validate (JSON Schema)
        run: go run ./tools/contract-validate

      - name: buf setup
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: lint .proto
        run: cd contracts/proto && buf lint

      - name: stubs gRPC al día (buf generate sin diffs)
        run: |
          # protoc-gen-go se instala en la version EXACTA que declara go.mod, no
          # con @latest. Con @latest el check compara los stubs commiteados
          # contra los que genera una version que cambia sola: en cuanto upstream
          # publica, el job falla en TODOS los PRs con un diff que es solo el
          # comentario "// protoc-gen-go vX.Y.Z" de la cabecera. Paso el
          # 2026-09-15 al salir protobuf v1.36.12 contra un go.mod en v1.36.11.
          PROTOBUF_VERSION="$(go list -m -f '{{.Version}}' google.golang.org/protobuf)"
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOBUF_VERSION}"
          # protoc-gen-go-grpc es un modulo aparte y NO figura en go.mod, asi que
          # va pinneado literal. Debe coincidir con la version de la cabecera de
          # los *_grpc.pb.go commiteados; al subirla hay que regenerar y commitear.
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          export PATH="$(go env GOPATH)/bin:$PATH"
          cd contracts/proto && buf generate
          cd "$GITHUB_WORKSPACE"
          if ! git diff --exit-code -- internal/earlywarning/grpc; then
            echo "Stubs gRPC desactualizados: corre 'make proto' y commitea."; exit 1
          fi

  # ── Validar que la imagen construye (sin publicar) ───────────────────────
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: early-warning:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
